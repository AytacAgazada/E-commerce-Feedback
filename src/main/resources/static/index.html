<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Scraper | Professional Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f2f5;
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --success: #10b981;
            --accent: #f59e0b;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            margin: 0; padding: 40px 20px;
            color: var(--text-dark);
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .search-area {
            display: flex; gap: 15px; margin: 20px 0;
        }
        input {
            flex: 1; padding: 15px 20px; border: 2px solid #e2e8f0;
            border-radius: 15px; font-size: 16px; transition: 0.3s;
            outline: none;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }

        button {
            padding: 15px 30px; border-radius: 15px; border: none;
            font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-main { background: var(--primary); color: white; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3); }

        #productResult {
            display: none;
            margin-top: 30px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .product-hero {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            background: linear-gradient(to right, #ffffff, #fcfcfd);
            padding: 20px;
            border-radius: 15px;
        }
        .product-img-placeholder {
            width: 100%; height: 300px; background: var(--primary-light);
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 50px; color: var(--primary);
        }
        .badge-site {
            background: var(--primary-light); color: var(--primary);
            padding: 5px 12px; border-radius: 8px; font-weight: 700; font-size: 12px;
        }
        .price-tag {
            font-size: 36px; font-weight: 800; color: var(--primary);
            margin: 15px 0; letter-spacing: -1px;
        }
        .description-box {
            background: #f8fafc; padding: 20px; border-radius: 12px;
            border: 1px dashed #cbd5e1; line-height: 1.7; color: var(--text-gray);
        }

        .minimal-table-card { padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: var(--text-gray); font-size: 12px; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-weight: 500; }
        .id-pill { background: #334155; color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; }

        .loader-spin {
            display: none; width: 24px; height: 24px;
            border: 3px solid #FFF; border-bottom-color: transparent;
            border-radius: 50%; animation: rotation 1s linear infinite;
        }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">

    <div class="card">
        <h1 style="margin:0; font-size: 28px; letter-spacing: -1px;">AI Feedback <span style="color:var(--primary)">Scraper</span></h1>
        <p style="color:var(--text-gray)">Məhsul linkini daxil edin və bütün datanı dərhal əldə edin.</p>

        <div class="search-area">
            <input type="text" id="urlInput" placeholder="https://umico.az/... və ya https://birmarket.az/...">
            <button class="btn-main" onclick="handleScrape()">
                <span id="btnText">Məlumatı Çək</span>
                <div id="loader" class="loader-spin"></div>
            </button>
        </div>

        <div id="productResult">
            <div class="product-hero">
                <div class="product-img-placeholder">📦</div>
                <div>
                    <span class="badge-site" id="pSource"></span>
                    <h2 id="pName" style="margin: 10px 0 5px 0; font-size: 24px;"></h2>
                    <p style="margin:0; color:var(--text-gray)">Baza ID: <strong id="pIdVal"></strong></p>
                    <div class="price-tag"><span id="pPrice"></span> <span id="pCurrency"></span></div>

                    <h4 style="margin: 20px 0 10px 0;">Məhsul haqqında:</h4>
                    <div class="description-box" id="pDesc"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card minimal-table-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin:0">📦 Baza Arxiv (Minimal)</h3>
            <button onclick="loadMinimalProducts()" style="background:none; border:none; color:var(--primary); cursor:pointer; font-weight:600;">🔄 Siyahını Yenilə</button>
        </div>
        <table>
            <thead>
            <tr>
                <th style="width: 100px;">ID</th>
                <th>MƏHSULUN ADI</th>
            </tr>
            </thead>
            <tbody id="minimalBody"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>💬 Müştəri Rəyləri</h3>
        <div class="search-area" style="max-width: 450px;">
            <input type="number" id="idInput" placeholder="ID daxil edin...">
            <button class="btn-main" style="background:var(--success)" onclick="fetchReviews()">Rəyləri Gör</button>
        </div>
        <table id="reviewsTable" style="display:none; margin-top:20px;">
            <thead>
            <tr>
                <th>Müəllif</th>
                <th>Rəy</th>
                <th style="width: 100px;">Reytinq</th>
            </tr>
            </thead>
            <tbody id="reviewsBody"></tbody>
        </table>
    </div>

</div>

<script>
    const BASE_URL = '/api/scrapers';

    async function handleScrape() {
        const url = document.getElementById('urlInput').value;
        if(!url) return;

        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const resultDiv = document.getElementById('productResult');

        btnText.style.display = 'none';
        loader.style.display = 'block';
        resultDiv.style.display = 'none';

        try {
            const response = await fetch(`${BASE_URL}/scrape_Product`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            const data = await response.json();

            document.getElementById('pName').innerText = data.name;
            document.getElementById('pPrice').innerText = data.price;
            document.getElementById('pCurrency').innerText = data.currency;
            document.getElementById('pSource').innerText = data.sourceSite;
            document.getElementById('pDesc').innerText = data.description;
            document.getElementById('pIdVal').innerText = data.id;

            resultDiv.style.display = 'block';
            loadMinimalProducts();
        } catch (e) {
            alert("Məlumat tapılmadı!");
        } finally {
            btnText.style.display = 'block';
            loader.style.display = 'none';
        }
    }

    async function loadMinimalProducts() {
        const tbody = document.getElementById('minimalBody');
        try {
            const response = await fetch(`${BASE_URL}/product/all-minimal`);
            const products = await response.json();
            tbody.innerHTML = '';
            products.forEach(p => {
                tbody.innerHTML += `<tr>
                    <td><span class="id-pill">${p.id}</span></td>
                    <td>${p.name}</td>
                </tr>`;
            });
        } catch (e) { console.error("Siyahı xətası"); }
    }

    async function fetchReviews() {
        const id = document.getElementById('idInput').value;
        const tbody = document.getElementById('reviewsBody');
        const table = document.getElementById('reviewsTable');
        if(!id) return;

        try {
            const response = await fetch(`${BASE_URL}/product-reviews/${id}`);
            const reviews = await response.json();
            tbody.innerHTML = '';
            reviews.forEach(r => {
                tbody.innerHTML += `<tr>
                    <td><strong>${r.author}</strong></td>
                    <td style="color:var(--text-gray)">${r.content}</td>
                    <td style="color:var(--accent)">★ ${r.rating}</td>
                </tr>`;
            });
            table.style.display = 'table';
        } catch (e) { alert("Xəta!"); }
    }

    window.onload = loadMinimalProducts;
</script>
</body>
</html>
